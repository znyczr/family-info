<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4a7cf7">
  <meta name="description" content="记录家人的基础信息，随时随地离线查看">
  <title>家人档案</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">

    <!-- ===== 首页：家人列表 ===== -->
    <section id="view-home" class="view active">
      <header class="app-header">
        <div class="header-title">
          <h1>家人档案</h1>
          <p id="member-count">共 0 位家人</p>
        </div>
        <div class="header-actions">
          <button class="icon-btn" id="btn-export" title="导出备份" aria-label="导出备份">
            <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg>
          </button>
          <button class="icon-btn" id="btn-import" title="导入备份" aria-label="导入备份">
            <svg viewBox="0 0 24 24"><path d="M12 15V3m0 0l-4 4m4-4l4 4M5 21h14"/></svg>
          </button>
        </div>
      </header>

      <main class="member-grid" id="member-grid"></main>

      <div id="empty-state" class="empty-state" hidden>
        <div class="empty-icon">🏠</div>
        <p>还没有家人记录</p>
        <p class="empty-hint">点击右下角 + 按钮添加</p>
      </div>

      <button id="fab-add" class="fab" title="添加家人" aria-label="添加家人">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>

      <!-- 安装到手机的提示条 -->
      <div id="install-banner" class="install-banner" hidden>
        <span>把「家人档案」安装到手机，离线也能用</span>
        <button id="btn-install" class="install-btn">安装</button>
        <button id="btn-install-close" class="install-close" aria-label="关闭">×</button>
      </div>

      <input type="file" id="file-import" accept=".json,application/json" hidden>
    </section>

    <!-- ===== 详情视图 ===== -->
    <section id="view-detail" class="view">
      <header class="sub-header">
        <button class="icon-btn back-btn" id="btn-back" title="返回" aria-label="返回">
          <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <h2 id="detail-title">家人信息</h2>
        <button class="text-btn" id="btn-edit" title="编辑">编辑</button>
      </header>
      <main id="detail-content"></main>
    </section>

    <!-- ===== 添加 / 编辑视图 ===== -->
    <section id="view-form" class="view">
      <header class="sub-header">
        <button class="text-btn" id="btn-form-cancel">取消</button>
        <h2 id="form-title">添加家人</h2>
        <button class="save-btn" id="btn-form-save">保存</button>
      </header>
      <main id="form-content"></main>
    </section>

    <!-- ===== 删除确认弹窗 ===== -->
    <div id="modal" class="modal" hidden>
      <div class="modal-box">
        <h3 id="modal-title">提示</h3>
        <p id="modal-text"></p>
        <div class="modal-actions">
          <button class="text-btn" id="modal-cancel">取消</button>
          <button class="danger-btn" id="modal-confirm">删除</button>
        </div>
      </div>
    </div>

  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
